name: CI Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 🛎️ Checkout do código
        uses: actions/checkout@v3

      - name: 🔧 Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: 📦 Instalar dependências
        run: npm install

      - name: 🔑 Configurar variáveis de ambiente
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: echo "Variáveis configuradas"

      - name: 🔄 Gerar cliente do Prisma
        run: npx prisma generate

      - name: 🚀 Rodar migrações do Prisma
        run: npx prisma migrate deploy

      - name: 🔍 Testar conexão com o banco de dados
        run: npx prisma db push

      - name: 🧪 Executar testes com Jest
        run: npm run jest:coverage

      - name: ✅ Push permitido apenas se os testes passarem
        if: success()
        run: echo "Os testes passaram! O push para develop está autorizado."
